[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-flashcard-maker"
version = "0.1.0"
description = "Download sports team logos and render print-ready flashcard images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32.0",
  "Pillow>=10.4.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
sports-flashcards = "sports_flashcard_maker.cli:cli_main"

[project.gui-scripts]
sports-flashcards-gui = "sports_flashcard_maker.gui:main"
